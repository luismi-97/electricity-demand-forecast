name: tests
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install without TensorFlow (NN tests are skipped)
        run: python -m pip install -e ".[dev,api,dashboard]"
      - name: Unit tests
        run: python -m pytest -q

  tests-nn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install with TensorFlow
        run: python -m pip install -e ".[dev,nn,api,dashboard]"
      - name: Unit tests including the neural network
        run: python -m pytest -q