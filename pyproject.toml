[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edf"
version = "0.1.0"
description = "Day-ahead electricity demand forecasting for Germany (open data)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "duckdb>=0.10",
    "pytz",
    "holidays>=0.40",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "joblib",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
nn = ["tensorflow>=2.15"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]
dashboard = ["streamlit>=1.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
